[project]
name = "winddesk-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Timing tests depend on machine speed: CI must not. Run them with: pytest -m perf
addopts = "-m 'not perf'"
markers = ["perf: wall-clock timing checks (deselected by default)"]

[tool.coverage.run]
source = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app/core"]
strict = true
